<!DOCTYPE html>
<html>
<head>
    <title>Spotify Mini-Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            transition: all 0.3s ease;
            background-color: rgba(0, 0, 0, 0.5);
        }
        #drag-region {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            -webkit-app-region: drag;
            background-color: rgba(0, 0, 0, 0);
        }
        #player {
            display: flex;
            flex-grow: 1;
            align-items: center;
        }
        #track-info {
            text-align: center;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        #track-name {
            font-weight: bold;
            color: white;
            font-size: 14px;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #artist-name {
            font-size: 12px;
            color: #ccc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #album-cover-container {
            position: relative;
            width: 100px;
            height: 100px;
        }
        #album-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }
        #controls {
            display: none;
            width: 0;
            background: rgba(0,0,0,0.7);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        #controls.expanded {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            height: auto;
            padding: 5px;
        }
        #button-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
        }
        /* Improved button styling */
        button {
            margin: 0 5px;
            padding: 5px 10px;
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            min-width: 32px;
        }
        button:hover {
            background-color: #1ED760;
            transform: scale(1.1);
        }
        #login-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #progress-volume-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        /* Improved progress bar */
        #progress-bar {
            width: 100%;
            height: 6px;
            background-color: #333;
            margin-bottom: 12px;
            cursor: pointer;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        #progress {
            width: 0%;
            height: 100%;
            background-color: #1DB954;
            border-radius: 3px;
            transition: width 0.1s ease;
        }
        /* Add hover effect */
        #progress-bar:hover {
            height: 8px;
        }
        #progress-bar:hover #progress {
            background-color: #1ED760;
        }
        
        /* Custom styling for volume slider with colored track */
        #volume-control {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333; /* Background for unfilled part */
            outline: none;
            margin-bottom: 8px;
            position: relative;
        }

        /* This creates a colored track behind the thumb */
        #volume-control::before {
            content: '';
            position: absolute;
            height: 100%;
            width: var(--volume-percent, 100%); /* Default to 100%, will be updated via JS */
            background-color: #1DB954;
            border-radius: 3px 0 0 3px;
            z-index: 1;
            pointer-events: none; /* Ensures clicks pass through to the slider */
        }

        #volume-control::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1DB954;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            z-index: 2; /* Ensure thumb is above the colored track */
        }

        #volume-control::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1DB954;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            position: relative;
            z-index: 2;
        }

        #volume-control::-webkit-slider-thumb:hover {
            background: #1ED760;
            width: 14px;
            height: 14px;
        }

        #volume-control::-moz-range-thumb:hover {
            background: #1ED760;
            width: 14px;
            height: 14px;
        }

        /* For Firefox - Need to define the track separately */
        #volume-control::-moz-range-progress {
            background-color: #1DB954;
            height: 100%;
            border-radius: 3px 0 0 3px;
        }
        
        /* Style for error message */
        #error-message {
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            background-color: rgba(255, 59, 48, 0.8);
            color: white;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            display: none;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="drag-region"></div>
        <div id="player">
            <div id="album-cover-container">
                <img id="album-cover" src="https://via.placeholder.com/300" alt="Album Cover">
            </div>
            <div id="controls">
                <div id="track-info">
                    <div id="track-name"></div>
                    <div id="artist-name"></div>
                </div>
                <div id="button-container">
                    <button id="previous">⏮</button>
                    <button id="play-pause">⏯</button>
                    <button id="next">⏭</button>
                    <button id="shuffle">🔀</button>
                    <button id="repeat">🔁</button>
                </div>
                <div id="progress-volume-container">
                    <div id="progress-bar">
                        <div id="progress"></div>
                    </div>
                    <input type="range" id="volume-control" min="0" max="100" value="100">
                </div>
            </div>
        </div>
    </div>
    <button id="login-button">Login to Spotify</button>
    <script src="renderer.js"></script>
</body>
</html>
